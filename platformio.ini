; iotdash player: HTML/CSS/JS app runtime for the Waveshare ESP32-S3-Touch-LCD-7.
; The app itself lives in the "bundle" partition (iotdash flash / iotdash dev).

[env:lcd7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; the boot screen (build it first: tools/iotdash.py os build)
board_build.embed_files = os/build/boot.idb
; Hybrid compile of the Arduino core with display-friendly settings:
;  - panel interrupt in IRAM. Not LCD_RGB_RESTART_IN_VSYNC: it restarts the panel DMA every
;    frame without resetting the driver's bounce-buffer counter, and the stray end-of-buffer
;    event that sometimes follows refills the wrong buffer: the frame shows 16 rows off (a
;    visible jump). The default restarts only when a frame lost an end-of-buffer event.
;  - 32 KB data cache with 64 B lines (the cache comes out of internal RAM, which the
;    radios need; 64 KB painted no faster: 50.8 vs 50.9 ms a full frame)
;  - code and rodata run from PSRAM, so flash writes (bundle commit, localStorage)
;    never disable the cache under the scan-out interrupt
custom_sdkconfig =
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    '# CONFIG_LCD_RGB_RESTART_IN_VSYNC is not set'
    CONFIG_ESP32S3_DATA_CACHE_32KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
    ; plain malloc() prefers PSRAM at any size: small allocations of the engine used to fill
    ; the internal RAM that WiFi, Bluetooth and task stacks must have (they ask for it by name)
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=0
    ; WiFi: transmit buffers allocated per packet (from PSRAM) instead of 8 static ones in
    ; internal RAM; 4 static receive buffers (the block-ack window may be twice that)
    '# CONFIG_ESP_WIFI_STATIC_TX_BUFFER is not set'
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
    CONFIG_ESP_WIFI_RX_BA_WIN=8
    ; Bluetooth LE central (src/radio.cpp): the NimBLE host allocates from PSRAM (internal RAM
    ; is the scarce resource). Not BT_CTRL_RUN_IN_FLASH_ONLY: the S3 controller library has no
    ; such build ("Controller lib error, need flash lib").
    '# CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL is not set'
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; a small central: scanning plus up to two links (controller memory is internal RAM)
    CONFIG_BT_CTRL_BLE_MAX_ACT=3
    '# CONFIG_BT_CTRL_BLE_MESH_SCAN_DUPL_EN is not set'
    CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=20
    CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=30
    CONFIG_BT_CTRL_BLE_ADV_REPORT_DISCARD_THRSHOLD=10
    '# CONFIG_BT_NIMBLE_50_FEATURE_SUPPORT is not set'
    CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=8
    CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=12
    CONFIG_BT_NIMBLE_TRANSPORT_EVT_DISCARD_COUNT=4
    CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=4096
    ; TLS (https fetch): mbedTLS takes its record buffers (~40 KB a connection) from PSRAM; in
    ; internal RAM they did not fit next to the radios (mbedtls_ssl_setup: -0x7F00, no memory)
    '# CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set'
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -O2
build_unflags = -Os
upload_port = /dev/cu.usbmodem5B901262921
monitor_port = /dev/cu.usbmodem5B901262921
upload_speed = 921600
monitor_speed = 921600
