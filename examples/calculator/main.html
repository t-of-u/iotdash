<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/system/theme.css">
<link rel="stylesheet" href="lib/calc.css">
<style>
  .keys { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); }
</style>
</head>
<body>
<div class="top">
  <h1>Calculator</h1>
  <div class="chip" id="toHistory">History</div>
  <div class="chip" id="toScientific">Scientific</div>
</div>
<div class="display">
  <div class="expr" id="expr"></div>
  <div class="value" id="value">0</div>
</div>
<div class="keys" id="keys">
  <div class="key fn clear" data-k="AC">AC</div><div class="key fn" data-k="back">⌫</div><div class="key fn" data-k="%">%</div><div class="key op" data-k="÷">÷</div>
  <div class="key" data-k="7">7</div><div class="key" data-k="8">8</div><div class="key" data-k="9">9</div><div class="key op" data-k="×">×</div>
  <div class="key" data-k="4">4</div><div class="key" data-k="5">5</div><div class="key" data-k="6">6</div><div class="key op" data-k="−">−</div>
  <div class="key" data-k="1">1</div><div class="key" data-k="2">2</div><div class="key" data-k="3">3</div><div class="key op" data-k="+">+</div>
  <div class="key fn" data-k="±">±</div><div class="key" data-k="0">0</div><div class="key" data-k=".">.</div><div class="key eq" data-k="=">=</div>
</div>
<script src="lib/calc.js"></script>
<script src="main.js"></script>
</body>
</html>
