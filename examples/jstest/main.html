<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/><circle cx="12" cy="15" r="2"/></svg>
  <h1>JS Test</h1>
  <span id="clock">--:--:--</span>
  <a class="more" href="pages/more/main.html">More ›</a>
</header>
<main>
  <section class="card">
    <h2>Counter</h2>
    <div class="row"><button id="dec">−</button><span id="count">0</span><button id="inc">+</button></div>
    <label class="sw"><input type="checkbox" id="toggle"> โหมดกลางคืน</label>
  </section>
  <section class="card">
    <h2>Input</h2>
    <input id="name" placeholder="พิมพ์ชื่อ…">
    <p id="hello">สวัสดี</p>
    <input type="range" id="level" min="0" max="100" value="40">
    <progress id="prog" max="100" value="40"></progress>
  </section>
  <section class="card wide">
    <h2>Sensors <small id="status">loading…</small></h2>
    <ul id="list"></ul>
  </section>
  <section class="card">
    <h2>Chart</h2>
    <canvas id="chart" width="220" height="110"></canvas>
  </section>
</main>
<script src="main.js"></script>
</body>
</html>
