<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../app.css">
<style>
  .pages { position: relative; height: 430px; overflow: hidden; }
  .page { padding: 14px; height: 100%; overflow-y: auto; }
  nav { display: flex; gap: 6px; padding: 8px 12px; background: #fff; }
  nav a { padding: 6px 12px; border-radius: 8px; color: #1d4ed8; text-decoration: none; background: #eff6ff; }
  nav a:active { background: #bfdbfe; }
  .item { padding: 12px; margin: 6px 0; background: #fff; border-radius: 10px; }
  .spin { width: 28px; height: 28px; border: 4px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pulse { animation: pulse 1.2s ease-in-out infinite alternate; display:inline-block; padding: 6px 12px; background:#16a34a; color:#fff; border-radius: 99px; }
  @keyframes pulse { from { opacity: .4; transform: scale(.95); } to { opacity: 1; transform: scale(1.05); } }
  dialog { border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.3); padding: 20px; }
  select, input[type=date], input[type=time], input[type=color] { margin: 4px 0; }
  details { background:#fff; border-radius:10px; padding:8px 12px; margin-top:8px; }
</style></head>
<body>
<nav><a href="#p1">ฟอร์ม</a><a href="#p2">รายการ</a><a href="#p3">เอฟเฟกต์</a><a href="#" onclick="navigate(-1); return false">กลับ</a></nav>
<div class="pages">
  <section class="page" id="p1" data-page>
    <select id="sel"><option>เลือกโหมด</option><option value="auto">อัตโนมัติ</option><option value="manual">ควบคุมเอง</option><optgroup label="ขั้นสูง"><option value="eco">ประหยัดพลังงาน</option></optgroup></select>
    <input type="date" id="date" value="2026-10-08">
    <input type="time" id="time" value="08:30">
    <input type="color" id="color" value="#2563eb">
    <div class="row" style="margin-top:8px"><label><input type="radio" name="r" checked> A</label><label><input type="radio" name="r"> B</label>
      <input type="number" id="num" value="5" style="width:90px"><button id="open">เปิด dialog</button></div>
    <textarea id="ta" placeholder="บันทึก…"></textarea>
    <details><summary>รายละเอียด</summary><p>ข้อความที่ซ่อนไว้</p></details>
    <p id="out">-</p>
  </section>
  <section class="page" id="p2" data-page></section>
  <section class="page" id="p3" data-page><span class="spin"></span> <span class="pulse">LIVE</span>
    <div id="box" style="width:80px;height:80px;background:#f59e0b;border-radius:12px;margin-top:16px;transition:transform .5s ease, background-color .5s"></div></section>
</div>
<dialog id="dlg"><h3 style="margin-top:0">ยืนยัน?</h3><p>ต้องการบันทึกค่าหรือไม่</p><button id="ok">ตกลง</button> <button id="cancel" style="background:#e5e7eb;color:#111">ยกเลิก</button></dialog>
<script>
const $ = (s) => document.querySelector(s);
$('#p2').innerHTML = Array.from({length: 40}, (_, i) => `<div class="item">รายการที่ ${i + 1} — อุปกรณ์ #${100 + i}</div>`).join('');
const out = () => { $('#out').textContent = [$('#sel').value, $('#date').value, $('#time').value, $('#color').value, $('#num').value].join(' | '); };
['#sel', '#date', '#time', '#color', '#num'].forEach((s) => $(s).addEventListener('change', out));
out();
$('#open').onclick = () => $('#dlg').showModal();
$('#ok').onclick = () => { $('#dlg').close('ok'); $('#out').textContent = 'saved!'; };
$('#cancel').onclick = () => $('#dlg').close();
$('#box').addEventListener('click', (e) => { e.target.style.transform = e.target.style.transform ? '' : 'translateX(200px) rotate(45deg)'; e.target.style.backgroundColor = e.target.style.transform ? '#ef4444' : ''; });
window.addEventListener('hashchange', () => console.log('hash', location.hash));
</script>
</body></html>
