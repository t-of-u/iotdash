<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Test</title>
<style>
  :root { --accent: #2563eb; --bg: #f1f5f9; --card: #ffffff; --muted: #64748b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, sans-serif; background: var(--bg); color: #0f172a; }
  header { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px;
           background: linear-gradient(90deg, #1e3a8a, #2563eb); color: white; }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .badge { margin-left: auto; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-size: 13px; }
  main { padding: 16px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(15,23,42,.08); }
  .card .label { color: var(--muted); font-size: 13px; }
  .card .value { font-size: 32px; font-weight: 700; margin-top: 4px; }
  .card .value small { font-size: 16px; font-weight: 500; color: var(--muted); }
  .wide { grid-column: span 2; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid #e2e8f0; }
  td { padding: 6px 4px; border-bottom: 1px solid #f1f5f9; }
  .ok { color: #16a34a; } .warn { color: #d97706; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  button { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 8px 14px; font-size: 15px; }
  button.ghost { background: #e2e8f0; color: #0f172a; }
  p.th { font-size: 15px; line-height: 1.5; margin: 6px 0 0; }
</style>
</head>
<body>
<header><h1>ฟาร์มเต้าหู้ Tofu Farm</h1><span class="badge">● ออนไลน์</span></header>
<main>
  <div class="card"><div class="label">อุณหภูมิ</div><div class="value">27.4<small> °C</small></div></div>
  <div class="card"><div class="label">ความชื้น</div><div class="value">68<small> %</small></div></div>
  <div class="card"><div class="label">Firmware</div><div class="value" style="font-size:24px">v1.2.4</div></div>
  <div class="card wide">
    <table>
      <tr><th>อุปกรณ์</th><th>สถานะ</th><th>อัปเดต</th></tr>
      <tr><td>Sensor A</td><td class="ok">ปกติ</td><td>12:04</td></tr>
      <tr><td>ปั๊มน้ำ</td><td class="warn">รอ</td><td>11:58</td></tr>
      <tr><td>ไฟส่องสว่าง</td><td class="ok">เปิด</td><td>11:30</td></tr>
    </table>
  </div>
  <div class="card">
    <div class="label">ควบคุม</div>
    <div class="row"><button>เปิดไฟ</button><button class="ghost">ปิด</button></div>
    <p class="th">ภาษาไทยต้องตัดคำได้ถูกต้องและสวยงาม น้ำ ปิ่น ญาติ ฐาน กุ้ง</p>
  </div>
</main>
</body>
</html>
