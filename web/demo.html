<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iotdash in the browser</title>
<style>
  body { margin: 0; padding: 24px; font: 14px system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
  canvas { width: 800px; height: 480px; border-radius: 12px; box-shadow: 0 10px 30px rgba(15, 23, 42, .2); display: block; outline: none; }
  .bar { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; max-height: 160px; overflow: auto; color: #475569; }
</style>
</head>
<body>
<!-- web/dist/demo.html: the engine with an app package. ?pkg=<url of an .idbz> -->
<canvas id="screen" width="800" height="480"></canvas>
<div class="bar">
  <input type="file" id="file" accept=".idbz">
  <label><input type="checkbox" id="inet" checked> internet</label>
  <label><input type="checkbox" id="wifi" checked> Wi-Fi in reach</label>
  <label><input type="checkbox" id="scaleOn" checked> scale on</label>
  <label>scale kg <input type="number" id="kg" value="0" step="0.05" style="width: 80px"></label>
  <button id="home">Home</button>
</div>
<div id="log"></div>
<script type="module">
  import { IotdashSim } from './iotdash-web.js';
  const $ = (s) => document.querySelector(s);
  const log = (s) => { $('#log').textContent += s + '\n'; $('#log').scrollTop = 1e9; };
  const sim = new IotdashSim({ canvas: $('#screen'), base: './', onLog: log });
  window.sim = sim;
  await sim.init();
  const pkgUrl = new URLSearchParams(location.search).get('pkg');
  let appId = null;
  if (pkgUrl) appId = sim.installPackage(await (await fetch(pkgUrl)).arrayBuffer()).id;
  sim.boot();
  if (appId) setTimeout(() => sim.launch(appId), 1500);
  $('#file').onchange = async (e) => {
    const m = sim.installPackage(await e.target.files[0].arrayBuffer());
    log(`installed ${m.id} ${m.version}`);
    sim.launch(m.id);
  };
  $('#inet').onchange = (e) => sim.setInternet(e.target.checked);
  $('#wifi').onchange = (e) => sim.setWifiReach(e.target.checked);
  $('#scaleOn').onchange = (e) => sim.scalePower(e.target.checked);
  $('#kg').oninput = (e) => sim.scale({ kg: +e.target.value || 0, stable: true });
  $('#home').onclick = () => sim.home();
  window.simReady = true;
</script>
</body>
</html>
